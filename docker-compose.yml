services:
  db:
    image: postgres:16-alpine
    container_name: sprout-assessment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-sprout_tasks}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sprout} -d ${POSTGRES_DB:-sprout_tasks}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
