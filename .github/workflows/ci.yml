name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  api:
    name: Lint, build and test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sprout_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sprout_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/sprout_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/sprout_test
      DATABASE_URL_TEST_UNPOOLED: postgres://postgres:postgres@localhost:5432/sprout_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (syntax check)
        run: npm run build

      - name: Apply database schema
        run: npm run db:init

      - name: Run tests
        run: npm test
